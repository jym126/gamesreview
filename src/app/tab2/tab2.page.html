<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Buscar juegos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>

  <ion-searchbar
    [animated]="true"
    placeholder="Buscar juego..."
    (ionInput)="findGame($event)"
    [debounce]="500"
    show-clear-button="always">
  </ion-searchbar>

  <!-- Spinner de carga -->
  @if (spinner) {
    <div class="ion-text-center ion-padding">
      <ion-spinner name="bubbles" color="primary"></ion-spinner>
      <p>Buscando juegos en IGDB...</p>
    </div>
  }

  <!-- Lista de resultados -->
  <ion-grid fixed>
    <ion-row>
      @for (game of games; track game.id) {
        <ion-col size="12" size-sm="6" size-md="4">
          <ion-card class="game-card" (click)="verDetalle(game.id)">
            <div class="cover-container">
              <ion-img [src]="game.background_image" [alt]="game.name"></ion-img>
            </div>
            <ion-card-header>
              <ion-card-title class="ion-text-nowrap">{{ game.name }}</ion-card-title>
            </ion-card-header>
          </ion-card>
        </ion-col>
      }
    </ion-row>
  </ion-grid>

  <!-- Mensaje si no hay resultados tras una búsqueda -->
  @if (!spinner && busquedaRealizada && games.length === 0) {
    <div class="ion-text-center ion-padding">
      <ion-icon name="search-outline" style="font-size: 48px;" color="medium"></ion-icon>
      <p>No se encontraron juegos con ese nombre.</p>
    </div>
  }

  <!-- Crédito corregido a IGDB -->
  <ion-row>
    <ion-col size="12" class="ion-text-end ion-padding-end">
      <a class="credit" href="https://www.igdb.com/" target="_blank" style="font-size: 10px; color: var(--ion-color-medium);">
        Data provided by: IGDB
      </a>
    </ion-col>
  </ion-row>

</ion-content>
