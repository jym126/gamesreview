<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title>Favoritos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Favoritos</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Mensaje si NO hay juegos guardados en favoritos -->
  <div *ngIf="juegosFavoritos.length === 0" class="empty-container ion-text-center ion-padding">
    <ion-icon name="heart-dislike-outline" class="empty-icon"></ion-icon>
    <h3>No tienes favoritos guardados</h3>
    <p>Agrega tus juegos preferidos desde Novedades, Próximamente o la Búsqueda para verlos aquí.</p>
  </div>

  <!-- Carrusel Swiper cuando SÍ hay juegos en favoritos -->
  <div *ngIf="juegosFavoritos.length > 0" class="swiper-wrapper-container">
    <swiper-container #swiper init="false">
      <swiper-slide *ngFor="let game of juegosFavoritos">
        
        <ion-card (click)="verDetalle(game.id)" class="game-card">

          <!-- Portada con badge de valoración e indicador de favorito -->
          <div class="cover-container">
            <ion-img 
              [src]="game.background_image || 'assets/splash.png'" 
              (ionError)="game.background_image = 'assets/splash.png'"
              [alt]="game.name">
            </ion-img>

            <ion-badge *ngIf="game.rating" color="warning" class="rating-badge">
              ★ {{ game.rating | number:'1.0-1' }}
            </ion-badge>

            <ion-icon name="heart" color="danger" class="favorite-indicator"></ion-icon>
          </div>

          <!-- Cabecera de la tarjeta con título y botón de opciones -->
          <ion-card-header>
            <div class="card-header-flex">
              <div>
                <ion-card-subtitle *ngIf="game.first_release_date">
                  Lanzamiento: {{ game.first_release_date * 1000 | date:'dd/MM/yyyy' }}
                </ion-card-subtitle>
                <ion-card-title class="game-title">
                  {{ game.name }}
                </ion-card-title>
              </div>

              <!-- Botón de opciones (se detiene la propagación para no abrir el modal al tocar los 3 puntos) -->
              <ion-button 
                fill="clear" 
                size="small" 
                color="medium"
                (click)="$event.stopPropagation(); onOpenMenu(game.id)">
                <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
              </ion-button>
            </div>
          </ion-card-header>

          <!-- Resumen del juego -->
          <ion-card-content *ngIf="game.summary">
            <p class="summary-text">{{ game.summary }}</p>
          </ion-card-content>

        </ion-card>

      </swiper-slide>
    </swiper-container>
  </div>

</ion-content>
